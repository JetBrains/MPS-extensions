          - --exclude=code/extensions/shadowmodels/solutions/de.q60.mps.polymorphicfunctions.sandbox/de.q60.mps.polymorphicfunctions.sandbox.msd
          - --exclude=code/extensions/shadowmodels/solutions/de.q60.mps.shadowmodels.examples.javainterpreter/de.q60.mps.shadowmodels.examples.javainterpreter.msd
          - --exclude=code/extensions/shadowmodels/solutions/de.q60.mps.shadowmodels.examples.output/de.q60.mps.shadowmodels.examples.output.msd
          - --exclude=code/extensions/solutions/com.mbeddr.mpsutil.intentions.sandbox/com.mbeddr.mpsutil.intentions.sandbox.msd
          - --exclude=code/extensions/solutions/de.itemis.model.merge.exec/de.itemis.model.merge.exec.msd
          - --exclude=code/extensions/solutions/de.itemis.mps.extensions.changelog/de.itemis.mps.extensions.changelog.msd
          - --exclude=code/extensions/spellcheck/solutions/de.itemis.mps.spellcheck.demo/de.itemis.mps.spellcheck.demo.msd
          - --exclude=code/extensions/structurecheck/solutions/de.itemis.mps.structurecheck.sandbox/de.itemis.mps.structurecheck.sandbox.msd
          - --exclude=code/extensions/tables/languages/de.slisson.mps.tables/sandbox/de.slisson.mps.tables.sandbox.msd
          - --exclude=code/extensions/treenotation/com.mbeddr.mpsutil.treenotation.sandbox/com.mbeddr.mpsutil.treenotation.sandbox.msd
          - --exclude=code/extensions/utils/solutions/de.itemis.mps.noderversioning.sandbox/de.itemis.mps.noderversioning.sandbox.msd

      # Existing modules whose descriptor file or directory name does not match the module name. Renaming a module
      # directory or descriptor touches build scripts and modules.xml files.
      - id: mps-check-module-naming
        exclude: |
          (?x)^(
            code/extensions/batik/solutions/de\.itemis\.stubs\.batik\.msd|
            code/extensions/blutil/languages/com\.mbeddr\.mpsutil\.blutil/blutil\.mpl|
            code/extensions/blutil/languages/com\.mbeddr\.mpsutil\.blutil/solutions/com\.mbeddr\.mpsutil\.blutil\.rt\.msd|
            code/extensions/blutil/tests/test\.ts\.match/match\.msd|
            code/extensions/celllayout/languages/de\.itemis\.mps\.celllayout/de\.itemis\.mps\.editor\.celllayout\.styles\.mpl|
            code/extensions/celllayout/solutions/de\.slisson\.mps\.editor\.celllayout\.runtime/de\.itemis\.mps\.editor\.celllayout\.runtime\.msd|
            code/extensions/celllayout/solutions/test\.de\.itemis\.mps\.editor\.celllayout\.runtime/test\.de\.itemis\.mps\.editor\.celllayout\.msd|
