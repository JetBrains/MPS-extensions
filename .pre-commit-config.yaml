# Checks run with prek (https://github.com/j178/prek) or pre-commit. See docs/contributing.md.
#
# The `exclude` lists and `--exclude` arguments below name existing files and modules that break a check. New files and
# modules are still checked. Remove an entry once its file is fixed.
repos:
  # MPS project-structure checks. See https://github.com/specificlanguages/mps-pre-commit-hooks for what each one
  # catches.
  - repo: "https://github.com/specificlanguages/mps-pre-commit-hooks"
    rev: v0.6.1
    hooks:
      - id: mps-fix-path-variables
      - id: mps-fix-missing-modules
      - id: mps-check-orphan-mpsr-files
      - id: mps-check-empty-model-roots

      # Existing modules that are not registered in any modules.xml.
      - id: mps-check-orphan-modules
        args:
          - --exclude=code/extensions/changelog/de.itemis.mps.changelog/sandbox/de.itemis.mps.changelog.sandbox.msd
          - --exclude=code/extensions/languages/de.itemis.model.merge.test/de.itemis.model.merge.test.mpl
          - --exclude=code/extensions/languages/de.itemis.model.merge.test/runtime/de.itemis.model.merge.test.runtime.msd
          - --exclude=code/extensions/languages/de.itemis.model.merge.test/sandbox/de.itemis.model.merge.test.sandbox.msd
          - --exclude=code/extensions/solutions/de.itemis.model.merge.exec/de.itemis.model.merge.exec.msd

      # Existing model files outside every model root, mostly leftover generator/template/main@generator.mps files in
      # languages without a generator.
      - id: mps-check-orphan-models
        args:
          - --exclude=code/extensions/celllayout/languages/de.itemis.mps.celllayout/generator/template/main@generator.mps
          - --exclude=code/extensions/celllayout/languages/de.itemis.mps.editor.celllayout.sandboxlang/generator/template/main@generator.mps
          - --exclude=code/extensions/celllayout/languages/test.de.itemis.mps.editor.celllayout.lang/generator/template/main@generator.mps
          - --exclude=code/extensions/conditional-editor/languages/de.slisson.mps.conditionalEditor.demolang/generator/template/main@generator.mps
          - --exclude=code/extensions/conditional-editor/languages/de.slisson.mps.conditionalEditor.hints/generator/template/main@generator.mps
          - --exclude=code/extensions/diagram/languages/de.itemis.mps.editor.diagram.demo.activity/generator/template/main@generator.mps
          - --exclude=code/extensions/diagram/languages/de.itemis.mps.editor.diagram.demo.callgraph/generator/template/main@generator.mps
          - --exclude=code/extensions/diagram/languages/de.itemis.mps.editor.diagram.demoentities/generator/template/main@generator.mps
          - --exclude=code/extensions/diagram/languages/de.itemis.mps.editor.diagram.layout/generator/template/main@generator.mps
          - --exclude=code/extensions/diagram/languages/de.itemis.mps.editor.diagram.styles/generator/template/main@generator.mps
          - --exclude=code/extensions/diagram/languages/test.de.itemis.mps.editor.diagram.lang/generator/template/main@generator.mps
          - --exclude=code/extensions/grammarcells/languages/com.mbeddr.mpsutil.grammarcells.runtimelang/generator/template/main@generator.mps
          - --exclude=code/extensions/grammarcells/languages/com.mbeddr.mpsutil.grammarcells.sandboxlang/generator/template/main@generator.mps
          - --exclude=code/extensions/hacks/languages/de.itemis.mps.hacks.xmodelgen/generator/template/main@generator.mps
          - --exclude=code/extensions/languages/de.itemis.model.merge.diamond/generator/templates/de.itemis.model.merge.diamond.generator.templates@generator.mps
          - --exclude=code/extensions/languages/de.itemis.model.merge.graph/generator/templates/de.itemis.model.merge.graph.templates@generator.mps
          - --exclude=code/extensions/languages/de.itemis.model.merge.graph/models/de.itemis.model.merge.graph.behavior.mps
          - --exclude=code/extensions/languages/de.itemis.model.merge.graph/models/de.itemis.model.merge.graph.constraints.mps
