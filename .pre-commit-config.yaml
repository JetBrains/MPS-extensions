          - --exclude=code/extensions/languages/de.itemis.model.merge.test/sandbox/de.itemis.model.merge.test.sandbox.msd
          - --exclude=code/extensions/langvis/languages/com.dslfoundry.langvis.demolang/com.dslfoundry.langvis.demolang.mpl
          - --exclude=code/extensions/langvis/solutions/com.dslfoundry.langvis.demo/com.dslfoundry.langvis.demo.msd
          - --exclude=code/extensions/modellisteners/com.mbeddr.mpsutil.modellisteners.sandbox/com.mbeddr.mpsutil.modellisteners.sandbox.msd
          - --exclude=code/extensions/pagination/solutions/de.itemis.mps.editor.pagination.demolang.sandbox/de.itemis.mps.editor.pagination.demolang.sandbox.msd
          - --exclude=code/extensions/projectview/com.mbeddr.mpsutil.projectview.demo/com.mbeddr.mpsutil.projectview.demo.msd
          - --exclude=code/extensions/querylist/com.mbeddr.mpsutil.editor.querylist.sandbox/com.mbeddr.mpsutil.editor.querylist.sandbox.msd
          - --exclude=code/extensions/shadowmodels/languages/de.q60.mps.incremental.sandboxlang/de.q60.mps.incremental.sandboxlang.mpl
