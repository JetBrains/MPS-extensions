            code/extensions/diagram/solutions/de\.itemis\.mps\.editor\.diagram\.runtime/de\.itemis\.mps\.editor\.diagram\.runtime\.msd|
            code/extensions/diagram/solutions/de\.itemis\.mps\.editor\.diagram\.runtime/models/de/itemis/mps/editor/diagram/runtime\.mps|
