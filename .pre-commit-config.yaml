          - --exclude=code/extensions/languages/de.itemis.model.merge.graph/models/de.itemis.model.merge.graph.typesystem.mps
          - --exclude=code/extensions/languages/de.itemis.model.merge.graph/sandbox/models/de.itemis.model.merge.graph.sandbox.mps
          - --exclude=code/extensions/languages/de.itemis.model.simple.demo.children/generator/templates/de.itemis.model.simple.demo.children.generator.templates@generator.mps
          - --exclude=code/extensions/languages/de.itemis.model.simple.demo.property/generator/templates/de.itemis.model.simple.demo.property.property.templates@generator.mps
          - --exclude=code/extensions/langvis/languages/com.dslfoundry.langvis.demolang/generator/template/main@generator.mps
          - --exclude=code/extensions/math/languages/de.itemis.mps.editor.math.demolang/generator/template/main@generator.mps
          - --exclude=code/extensions/model-api/org.modelix.model.repositoryconcepts/generator/templates/org.modelix.model.repositoryconcepts.generator.templates@generator.mps
          - --exclude=code/extensions/modellisteners/com.mbeddr.mpsutil.modellisteners.sandboxlang/generator/template/main@generator.mps
          - --exclude=code/extensions/nodeversioning/languages/de.itemis.mps.nodeversioning/generator/template/main@generator.mps
          - --exclude=code/extensions/plaintextgen/languages/com.dslfoundry.plaintextgen/generator/template/main@generator.mps
          - --exclude=code/extensions/querylist/com.mbeddr.mpsutil.editor.querylist.demolang/generator/template/main@generator.mps
          - --exclude=code/extensions/shadowmodels/languages/de.q60.mps.incremental.sandboxlang/generator/template/main@generator.mps
          - --exclude=code/extensions/shadowmodels/languages/de.q60.mps.polymorphicfunctions.sandboxlang/generator/template/main@generator.mps
          - --exclude=code/extensions/shadowmodels/languages/de.q60.mps.shadowmodels.examples.blext/generator/template/main@generator.mps
          - --exclude=code/extensions/shadowmodels/languages/de.q60.mps.shadowmodels.examples.editor/generator/template/main@generator.mps
          - --exclude=code/extensions/shadowmodels/languages/de.q60.mps.shadowmodels.examples.entities/generator/template/main@generator.mps
          - --exclude=code/extensions/shadowmodels/languages/de.q60.mps.shadowmodels.examples.statemachine/generator/template/main@generator.mps
          - --exclude=code/extensions/shadowmodels/languages/de.q60.mps.shadowmodels.repository/generator/template/main@generator.mps
          - --exclude=code/extensions/shadowmodels/languages/de.q60.mps.shadowmodels.runtimelang/generator/template/main@generator.mps
          - --exclude=code/extensions/shadowmodels/languages/de.q60.mps.shadowmodels.target.editor/generator/template/main@generator.mps
          - --exclude=code/extensions/shadowmodels/languages/de.q60.mps.shadowmodels.target.text/generator/template/main@generator.mps
          - --exclude=code/extensions/shadowmodels/languages/de.q60.mps.virtualinterfaces.sandboxlang/generator/template/main@generator.mps
          - --exclude=code/extensions/solutions/de.itemis.model.merge.policy.diamond/models/de.itemis.model.merge.policy.diamond.plugin.mps
          - --exclude=code/extensions/tables/languages/de.slisson.mps.tables.demolang/generator/template/main@generator.mps
          - --exclude=code/extensions/third-party/solutions/MPS.ThirdParty/models/MPS.Thirdparty.keep_me.mps
          - --exclude=code/extensions/treenotation/com.mbeddr.mpsutil.treenotation.sandboxlang/generator/template/main@generator.mps
          - --exclude=code/extensions/treenotation/com.mbeddr.mpsutil.treenotation.styles/generator/template/main@generator.mps
          - --exclude=code/extensions/widgets/languages/de.itemis.mps.editor.bool.demolang/generator/template/main@generator.mps
          - --exclude=code/extensions/widgets/languages/de.itemis.mps.editor.collapsible.testlang/generator/template/main@generator.mps
          - --exclude=code/extensions/widgets/languages/de.itemis.mps.editor.dropdown.demolang/generator/template/main@generator.mps
          - --exclude=code/extensions/widgets/languages/de.itemis.mps.editor.enumeration.demolang/generator/template/main@generator.mps
          - --exclude=code/extensions/widgets/languages/nl.f1re.mps.editor.intellij/generator/templates/nl.f1re.mps.editor.intellij.generator.templates@generator.mps
