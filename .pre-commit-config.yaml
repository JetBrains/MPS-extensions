        # Empty .model header file of a model that is not in any model root.
        exclude: |
          (?x)^(
            code/extensions/widgets/solutions/de\.itemis\.mps\.editor\.collapsible\.tests/models/de\.itemis\.mps\.editor\.collapsible\.tests@tests/\.model
          )$

      # Existing modules that no build script packages: sandboxes, demos, tests and other modules that are not shipped.
      - id: mps-check-unbuilt-modules
        args:
          - --exclude=code/extensions/blutil/tests/test.com.mbeddr.mpsutil.blutil/test.com.mbeddr.mpsutil.blutil.msd
          - --exclude=code/extensions/changelog/de.itemis.mps.changelog.sandbox/de.itemis.mps.changelog.sandbox.msd
          - --exclude=code/extensions/changelog/de.itemis.mps.changelog/sandbox/de.itemis.mps.changelog.sandbox.msd
          - --exclude=code/extensions/devkits/de.q60.mps.genplan.virutalinterfaces_incremental.devkit/de.q60.mps.genplan.virutalinterfaces_incremental.devkit.devkit
          - --exclude=code/extensions/devkits/de.q60.mps.incremental.devkit/de.q60.mps.incremental.devkit.devkit
          - --exclude=code/extensions/grammarcells/solutions/com.mbeddr.mpsutil.grammarcells.sandbox/com.mbeddr.mpsutil.grammarcells.sandbox.msd
